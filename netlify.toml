# Example config for self hosting on Netlify.
# Set CONVEX_DEPLOY_KEY in the Netlify dashboard (Site configuration, Environment variables),
# never in this file. `npx convex deploy` sets VITE_CONVEX_URL for the build.
[build]
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
